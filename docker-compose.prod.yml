# FloodWatch LK - production stack for floodwatch.teklab.dev (shared Tencent VM).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# No host ports and no Caddy here: the host's existing Caddy
# (synapses-app-caddy-1) reaches floodwatch-frontend / floodwatch-backend over
# the external `edge` network. Postgres sits only on the internal network.
# Edge-attached services carry a floodwatch- prefix because every service name
# becomes a DNS alias on `edge`, which other projects share.
# See deploy/teklab/RUNBOOK.md.

name: floodwatch

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: floodwatch
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: floodwatch
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodwatch -d floodwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  floodwatch-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_HOST: db
      ALERTS_ENABLED: "false"
      SOS_ENABLED: "false"
      # Optional third-party keys; empty = that feature degrades. Core data
      # (Open-Meteo, GDACS, Met Dept) needs no key.
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      HERE_API_KEY: ${HERE_API_KEY:-}
      WEATHER_SOURCE: ${WEATHER_SOURCE:-open_meteo}
      # ReliefWeb API v2 appname (pre-approved by ReliefWeb); empty = source off
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-}
      FRONTEND_URL: https://floodwatch.teklab.dev
      DEBUG: "false"
    secrets:
      - db_password
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  floodwatch-frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined into the bundle at build time.
        # Optional, public browser key: empty hides the "Satellite (Esri)" option.
        NEXT_PUBLIC_ARCGIS_API_KEY: ${NEXT_PUBLIC_ARCGIS_API_KEY:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://floodwatch-backend:8000
    networks:
      - internal
      - edge
    depends_on:
      - floodwatch-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  # Self-hosted basemap: serves /tiles/{lka,region,context}.pmtiles (scripts/build_basemap.sh)
  # with HTTP Range support. Reached only via the host Caddy (handle /tiles/*).
  floodwatch-tiles:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ${FLOODWATCH_TILES_DIR:-/opt/floodwatch-data/tiles}:/srv/tiles:ro
      - ./deploy/teklab/tiles.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

secrets:
  db_password:
    # Decrypted at boot into tmpfs by deploy/teklab/floodwatch-secrets.service.
    file: /run/floodwatch/db_password

networks:
  internal:
    internal: true
  edge:
    external: true

volumes:
  postgres_data:
